[project]
name = "agentx-api"
version = "0.0.1"
description = "Thin FastAPI control surface over the Agent-X kernel projections and journal."
requires-python = ">=3.12,<3.13"
dependencies = [
    "agentx-contracts",
    "agentx-db",
    "agentx-kernel",
    "agentx-mandate",
    "agentx-syscall",
    "agentx-swarm",
    "fastapi>=0.124,<1",
    "uvicorn[standard]>=0.38,<1",
    "pymongo>=4.17,<5",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.4,<2",
    "ruff>=0.15,<0.16",
    "mypy>=2.1,<3",
]

[tool.uv.sources]
agentx-contracts = { path = "../packages/contracts", editable = true }
agentx-db = { path = "../db", editable = true }
agentx-kernel = { path = "../packages/kernel", editable = true }
agentx-mandate = { path = "../packages/mandate", editable = true }
agentx-syscall = { path = "../packages/syscall", editable = true }
agentx-swarm = { path = "../packages/swarm", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentx_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["UP040"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
