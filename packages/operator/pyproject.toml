[project]
name = "agentx-operator"
version = "0.0.1"
description = "Near-term (NOT Phase 1): the Operator Agent — a gated, privileged USER of the kernel command/query API."
requires-python = ">=3.12,<3.13"
dependencies = [
    "agentx-contracts",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentx_operator"]
