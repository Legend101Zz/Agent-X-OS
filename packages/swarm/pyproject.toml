[project]
name = "agentx-swarm"
version = "0.0.1"
description = "CODEX LANE: Swarm REPL, scenario packs, SimAdapter, promptfoo bridge (Judge), PromotionGate."
requires-python = ">=3.12,<3.13"
dependencies = [
    "agentx-contracts",
    # NOTE: promptfoo runs as a SUBPROCESS via `npx promptfoo@latest ...` (no Python dependency).
    # The kernel's RunInvoker is wired as a promptfoo Python custom provider (file://kernel_provider.py).
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentx_swarm"]
