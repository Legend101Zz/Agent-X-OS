[project]
name = "agentx-mandate"
version = "0.0.1"
description = "CLAUDE LANE: Type/Instance/Run, seven organs, faculties framework, memory layer, hydration, settlement."
requires-python = ">=3.12,<3.13"
# INVARIANT #2: mandate (user-space pods) depends ONLY on contracts. It must NEVER gain a dependency that
# carries credentials (no agentx-db, no pymongo, no SDK with secrets). Enforced by import-linter + a guard test.
dependencies = [
    "agentx-contracts",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentx_mandate"]
