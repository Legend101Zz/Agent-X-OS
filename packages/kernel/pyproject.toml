[project]
name = "agentx-kernel"
version = "0.0.1"
description = "CLAUDE LANE: scheduler, heap+journal, verifier, gateway, run-loop (live+sim), supervision, command API."
requires-python = ">=3.12,<3.13"
dependencies = [
    "agentx-contracts",
    "agentx-db",
    "agentx-mandate",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentx_kernel"]
