[project]
name = "agentx-syscall"
version = "0.0.1"
description = "CODEX LANE: Adapter framework + registry + fulfillment-ladder (HumanTask tail), Phase-1 adapters."
requires-python = ">=3.12,<3.13"
dependencies = [
    "agentx-contracts",
    "firecrawl-py>=4.30,<5",
    # --- Optional provider / protocol additions ---
    # "mcp>=1.27,<2",            # MCP client — wrap MCP servers BEHIND the gateway (never raw to harness)
    # "exa-py>=2.14,<3",         # lead_research_batch / read_url provider (EXA_API_KEY)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentx_syscall"]
