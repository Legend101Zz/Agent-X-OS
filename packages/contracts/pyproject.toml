[project]
name = "agentx-contracts"
version = "0.0.1"
description = "THE SEAM: Pydantic v2 domain/memory models + typing.Protocol interfaces. Frozen after Session A."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.14,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentx_contracts"]
